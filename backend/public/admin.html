<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Page Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }
    input, select, button, textarea { margin: 0.5em 0; display: block; }
    .element { border: 1px solid #ccc; padding: 1em; margin-bottom: 1em; }
    .actions { margin-top: 0.5em; }
  </style>
</head>
<body>
  <header style="margin-bottom:1rem;">
    <h1 style="margin:0;">Admin</h1>
  </header>

  <main>
    <!-- 3-column layout: left nav (20%), middle list/panel (30%), right detail manager (50%) -->
    <div id="adminColumns" style="display:flex; gap:1rem;">
      <!-- left nav column -->
      <aside id="leftNav" style="width:20%;">
        <div style="position:sticky; top:1rem;">
          <h3>Navigation</h3>
          <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0.5rem;">
            <li><a href="#" onclick="showTab('admin');return false">Admin Home</a></li>
            <li><a href="#" onclick="showTab('menu');return false">Menu</a></li>
            <li><a href="#" onclick="showTab('pages');return false">Pages</a></li>
            <li><a href="#" onclick="showTab('settings');return false">Settings</a></li>
            <li><a href="#" onclick="showTab('account');return false">Account</a></li>
            <li><a href="#" onclick="logout();return false">Logout</a></li>
          </ul>
        </div>
      </aside>

      <!-- middle panel: list or panel overview (30%) -->
      <section id="listPanel" style="width:30%; min-height:400px; border-left:1px solid #eee; padding-left:1rem;"></section>

      <!-- right panel: detail / item management (50%) -->
      <section id="detailPanel" style="width:50%; min-height:400px; border-left:1px solid #eee; padding-left:1rem;"></section>
    </div>
  </main>

  <script>
    // Minimal admin-level helpers only. Panel-specific logic lives inside each panel.
    function logout() {
      window.location = '/logout';
    }

    // Track which panel is currently loaded in the list column so we can swap reliably
    let currentListTab = null;
    function showTab(tab) {
      const el = document.getElementById('listPanel');
      const detailEl = document.getElementById('detailPanel');
      // Clear detail column whenever navigation changes
      if (detailEl) detailEl.innerHTML = '';
      if (!el) return;
      // If the requested tab is already active, call its refresh function if one exists
      if (currentListTab === tab) {
        const refreshFn = window[`panelRefresh_${tab}`];
        if (typeof refreshFn === 'function') {
          try { refreshFn(); } catch (err) { console.error('panel refresh error', err); }
        }
        return;
      }
      // Otherwise load/replace the list panel with the requested tab
      currentListTab = tab;
      el.innerHTML = ''; // clear
      fetch(`/panels/${tab}.html`)
        .then(r => r.text())
        .then(html => {
          const tmp = document.createElement('div');
          tmp.innerHTML = html;
          Array.from(tmp.childNodes).forEach(node => {
            if (node.tagName && node.tagName.toLowerCase() === 'script') return;
            el.appendChild(node.cloneNode(true));
          });
          const scripts = Array.from(tmp.querySelectorAll('script'));
          function runScripts(i) {
            if (i >= scripts.length) {
              const initFn = window[`panelInit_${tab}`];
              if (typeof initFn === 'function') {
                try { initFn(); } catch (err) { console.error('panel init error', err); }
              }
              return;
            }
            const s = scripts[i];
            const newScript = document.createElement('script');
            if (s.src) {
              newScript.src = s.src;
              newScript.onload = () => runScripts(i + 1);
              newScript.onerror = () => runScripts(i + 1);
              document.body.appendChild(newScript);
            } else {
              try { newScript.text = s.textContent; document.body.appendChild(newScript); } catch (e) { try { eval(s.textContent); } catch (err) { console.error('script eval error', err); } }
              runScripts(i + 1);
            }
          }
          runScripts(0);
        })
        .catch(err => { el.innerHTML = '<p>Failed to load panel.</p>'; console.error(err); });
    }

    // Load a management/detail panel into the right-side detail column.
    function loadDetail(panel, id) {
      const el = document.getElementById('detailPanel');
      if (!el) return;
      // expose the id to the panel initializer as soon as possible
      window.pendingDetailId = id;
      // Clear existing detail content each time
      el.innerHTML = '';
      fetch(`/panels/${panel}.html`)
        .then(r => r.text())
        .then(html => {
          const tmp = document.createElement('div');
          tmp.innerHTML = html;
          Array.from(tmp.childNodes).forEach(node => {
            if (node.tagName && node.tagName.toLowerCase() === 'script') return;
            el.appendChild(node.cloneNode(true));
          });
          const scripts = Array.from(tmp.querySelectorAll('script'));
          function runScripts(i) {
            if (i >= scripts.length) {
              // expose the id to the panel initializer as needed
              window.pendingDetailId = id;
              const initFn = window[`panelInit_${panel}`];
              if (typeof initFn === 'function') {
                try { initFn(); } catch (err) { console.error('detail panel init error', err); }
              }
              return;
            }
            const s = scripts[i];
            const newScript = document.createElement('script');
            if (s.src) {
              newScript.src = s.src;
              newScript.onload = () => runScripts(i + 1);
              newScript.onerror = () => runScripts(i + 1);
              document.body.appendChild(newScript);
            } else {
              try { newScript.text = s.textContent; document.body.appendChild(newScript); } catch (e) { try { eval(s.textContent); } catch (err) { console.error('script eval error', err); } }
              runScripts(i + 1);
            }
          }
          runScripts(0);
        })
        .catch(err => { el.innerHTML = '<p>Failed to load detail panel.</p>'; console.error(err); });
    }

    // Kick things off: show the pages panel. The panel's own initializer will fetch and render pages.
    showTab('pages');
  </script>
</body>
</html>
